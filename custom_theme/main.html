{% extends "base.html" %}

{% block extrahead %}
<style>
#language-switcher {
    position: fixed !important;
    top: 20px !important;
    right: 20px !important;
    z-index: 9999 !important;
    background: white !important;
    border: 1px solid #ddd !important;
    border-radius: 5px !important;
    padding: 5px !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important;
}

.lang-btn {
    background: transparent !important;
    border: none !important;
    padding: 8px 12px !important;
    cursor: pointer !important;
    border-radius: 3px !important;
    margin: 2px !important;
    font-size: 12px !important;
}

.lang-btn:hover {
    background: #f0f0f0 !important;
}

.lang-btn.active {
    background: #2980b9 !important;
    color: white !important;
}
</style>
{% endblock %}

{% block content %}
<div id="language-switcher">
    <button onclick="switchLanguage('zh')" id="btn-zh" class="lang-btn">中文</button>
    <button onclick="switchLanguage('en')" id="btn-en" class="lang-btn">English</button>
</div>

<script>
function switchLanguage(lang) {
    var currentPath = window.location.pathname;
    var currentPage = '';
    
    if (currentPath.includes('/zh/')) {
        currentPage = currentPath.replace('/zh/', '').replace('.html', '');
    } else if (currentPath.includes('/en/')) {
        currentPage = currentPath.replace('/en/', '').replace('.html', '');
    }
    
    var basePath = window.location.origin + window.location.pathname.split('/zh/')[0].split('/en/')[0];
    
    if (lang === 'zh') {
        window.location.href = basePath + '/zh/' + (currentPage || 'index') + '.html';
    } else {
        window.location.href = basePath + '/en/' + (currentPage || 'index') + '.html';
    }
}

var currentPath = window.location.pathname;
if (currentPath.includes('/en/')) {
    document.getElementById('btn-en').classList.add('active');
} else {
    document.getElementById('btn-zh').classList.add('active');
}
</script>

{{ super() }}
{% endblock %}
