{% extends "base.html" %}

{% block extrahead %}
<style>
#language-switcher {
    position: fixed !important;
    top: 20px !important;
    right: 20px !important;
    z-index: 9999 !important;
    background: white !important;
    border: 1px solid #ddd !important;
    border-radius: 5px !important;
    padding: 5px !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important;
}

.lang-btn {
    background: transparent !important;
    border: none !important;
    padding: 8px 12px !important;
    cursor: pointer !important;
    border-radius: 3px !important;
    margin: 2px !important;
    font-size: 12px !important;
}

.lang-btn:hover {
    background: #f0f0f0 !important;
}

.lang-btn.active {
    background: #2980b9 !important;
    color: white !important;
}
</style>
{% endblock %}

{% block content %}
<div id="language-switcher">
    <button onclick="switchLanguage('zh')" id="btn-zh" class="lang-btn">中文</button>
    <button onclick="switchLanguage('en')" id="btn-en" class="lang-btn">English</button>
</div>

<script>
function switchLanguage(lang) {
    var currentPath = window.location.pathname;
    var currentPage = '';
    
    if (currentPath.includes('/en/')) {
        currentPage = currentPath.replace('/en/', '');
    } else {
        currentPage = currentPath.replace('/', '');
    }
    
    var isLocal = window.location.hostname === 'localhost' || 
                  window.location.hostname === '127.0.0.1';
    
    if (isLocal) {
        // Local testing - get full URL with port
        var port = window.location.port ? ':' + window.location.port : '';
        var baseUrl = window.location.protocol + '//' + window.location.hostname + port;
        
        if (lang === 'zh') {
            window.location.href = baseUrl + '/' + currentPage;
        } else {
            window.location.href = baseUrl + '/en/' + currentPage;
        }
    } else {
        // GitHub Pages
        if (lang === 'zh') {
            window.location.href = 'https://jiabob.github.io/PMTaro_manual_full/' + currentPage;
        } else {
            window.location.href = 'https://jiabob.github.io/PMTaro_manual_full/en/' + currentPage;
        }
    }
}
</script>

{{ super() }}
{% endblock %}
